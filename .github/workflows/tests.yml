name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mariadb:
        # 11.7 bringt den Spaltentyp VECTOR mit, den die Ähnlichkeitssuche nutzt.
        image: mariadb:11.7
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 1
          MARIADB_DATABASE: leihregal_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - uses: actions/checkout@v5

      - name: PHP einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, zip, gd, intl, bcmath, pdo_mysql
          coverage: none

      - name: Composer-Abhängigkeiten
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Ohne gebautes Frontend fehlt public/build/manifest.json, und jeder
      # Test, der eine Seite rendert, scheitert an @vite.
      - name: Frontend bauen
        run: npm ci && npm run build

      - name: Umgebung vorbereiten
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Tests
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USERNAME: root
          DB_PASSWORD: ''
        run: php artisan test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - name: Formatierung prüfen
        run: vendor/bin/pint --test
