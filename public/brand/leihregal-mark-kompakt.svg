<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Leihregal">
  <!--
    Vereinfachte Bildmarke für kleine Größen (Favicon, 16–48 px).

    Gleiches Motiv wie die volle Marke, aber nur drei statt vier Rücken und
    deutlich breiter. Bei vier Rücken verschmelzen die Zwischenräume unter
    32 Pixel zu einem grauen Block; hier bleibt die Silhouette lesbar.
    Der Regalboden entfällt – eine 26 Pixel hohe Linie wäre bei 16 Pixel
    Kantenlänge weniger als ein Bildpunkt.
  -->
  <defs>
    <linearGradient id="leihregalBlauKompakt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#leihregalBlauKompakt)"/>

  <rect x="86"  y="150" width="104" height="230" rx="26" fill="#FFFFFF" opacity="0.85"/>
  <rect x="214" y="118" width="104" height="262" rx="26" fill="#FFFFFF"/>
  <rect x="342" y="140" width="104" height="240" rx="26" fill="#FFFFFF"
        transform="rotate(14 394 380)"/>
</svg>
