<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!--
    Vorschaubild für geteilte Links (Open Graph, 1200×630).
    Gleiche Marke, gleiche Farben – nur im Querformat.
    Die Sperrschrift ist als Ganzes optisch zentriert.
  -->
  <defs>
    <linearGradient id="vg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#F9FAFB"/>
  <rect x="0" y="0" width="1200" height="10" fill="url(#vg)"/>

  <g transform="translate(276 223) scale(0.36)">
    <rect width="512" height="512" rx="116" fill="url(#vg)"/>
    <rect x="112" y="372" width="288" height="26" rx="13" fill="#FFFFFF" opacity="0.55"/>
    <rect x="132" y="168" width="58" height="196" rx="16" fill="#FFFFFF" opacity="0.92"/>
    <rect x="202" y="134" width="58" height="230" rx="16" fill="#FFFFFF"/>
    <rect x="272" y="184" width="58" height="180" rx="16" fill="#FFFFFF" opacity="0.82"/>
    <rect x="342" y="150" width="58" height="214" rx="16" fill="#FFFFFF" transform="rotate(13 371 364)"/>
  </g>

  <text x="492" y="304" font-family="Figtree, DejaVu Sans, sans-serif" font-size="76"
        font-weight="700" fill="#111827" letter-spacing="-2">Leihregal</text>
  <text x="494" y="350" font-family="Figtree, DejaVu Sans, sans-serif" font-size="27"
        fill="#6B7280">Medienbibliothek</text>
  <text x="494" y="392" font-family="Figtree, DejaVu Sans, sans-serif" font-size="23"
        fill="#9CA3AF">für sozialpädagogische Einrichtungen</text>
</svg>
